# Reviewed exceptions for `cargo audit --deny warnings`. Each one has a
# disposition in docs/security/dependency-policy.md.
[advisories]
ignore = [
  # proc-macro-error2 2.0.1 is unmaintained. It is a `cfg(hax)` dependency of
