primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = 300

[build]
  dockerfile = "Dockerfile"

[[mounts]]
  source = "mesh_soak_data"
  destination = "/data"
  processes = ["app"]

[[restart]]
  policy = "never"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["app"]
