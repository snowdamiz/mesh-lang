const defs=[

function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function fmt(v){return Number(v.toPrecision(3)).toString()}
function setting(r){return r.setting+(r.mode==='sustained'?' · 5 min':'')}

 const opts=data.filter(r=>def.modes.includes(r.mode)),p=el('section','panel'),config=el('div','config'),rows=el('div'),info=el('div','info');
 p.append(el('h3','',def.name),el('div','unit',def.unit),config,rows,info);document.getElementById('grid').append(p);
 function draw(r){
   rows.replaceChildren();const max=Math.max(...names.map(n=>r.series[n].med));
   for(let i=0;i<4;i++){
    const n=names[i],v=r.series[n],row=el('div','row '+colors[i]),track=el('div','track'),bar=el('div','bar');
