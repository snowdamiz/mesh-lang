[package]
name = "durable-jobs-apalis-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[dependencies]
apalis = { version = "=1.2.0", default-features = false, features = ["limit"] }
apalis-postgres = "=1.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time"] }
ulid = "3"
