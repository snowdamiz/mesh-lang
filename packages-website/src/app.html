<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#f7f2ea" />
    <meta property="og:site_name" content="Mesh Packages" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@meshlang" />

    <!-- Light unless the visitor chose dark; set before first paint so nothing flashes. -->
    <script>
      (function () {
        if (localStorage.getItem('theme') !== 'dark') return;
        document.documentElement.classList.add('dark');
        document.querySelector('meta[name="theme-color"]').content = '#141312';
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
