[package]
name = "mesh-rt"
version = "0.1.8"
edition = "2021"
description = "Mesh language runtime library (GC, strings, panic handler, actor scheduler)"

[lib]
crate-type = ["staticlib", "lib"]

[features]
fuzzing = []

[dependencies]
crossbeam-deque = "0.8"
crossbeam-utils = "0.8"
crossbeam-channel = "0.5"
corosensei = "0.3"
parking_lot = "0.12"
rustc-hash = { workspace = true }
serde_json = "1"
serde = { workspace = true }
ureq = { version = "3", features = ["gzip"] }
url = "2"
openraft = { version = "0.9.21", features = ["serde", "storage-v2"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
redb = "4.1"
libsqlite3-sys = { version = "0.36", features = ["bundled"] }
# Phase 54: PostgreSQL wire protocol
sha2 = "0.10"
hmac = "0.12"
subtle = "2.6"
md-5 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
base64 = "0.22"
# Phase 59: WebSocket Sec-WebSocket-Accept (RFC 6455)
sha1 = "0.10"
rand = "0.9"
# Phase 119: Regular expression support
regex = "1"
# Phase 136: DateTime stdlib
# Note: clock feature is NOT used — it requires iana-time-zone + CoreFoundation framework
# on macOS in static library builds. utc_now() uses std::time::SystemTime instead.
chrono = { version = "0.4", default-features = false, features = ["std", "alloc"] }
# Phase 55: TLS for PostgreSQL connections
# Direct deps for TLS (ureq 3 uses rustls internally as well).
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging", "std"] }
webpki-roots = "0.26"
rustls-pki-types = "1"
# Phase 64: ring for ECDSA key generation (ephemeral TLS certs for node connections)
# Already compiled as transitive dep of rustls -- zero additional compile time.
ring = "=0.17.14"
zeroize = "1.8"
argon2 = { version = "=0.5.3", default-features = false, features = ["zeroize"] }
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false }
# Feature-unify the transitive authenticator so key state zeroizes on drop.
poly1305 = { version = "=0.8.0", default-features = false, features = ["zeroize"] }
# ML-KEM-768 from Cryspen's formally verified libcrux. Only the ML-KEM-768
# parameter set; the runtime calls its portable implementation on every
# target (see docs/security/dependency-policy.md).
libcrux-ml-kem = { version = "=0.0.10", default-features = false, features = ["mlkem768"] }
# Blind RSA (profile BR1): constant-time Montgomery exponentiation and safegcd
# inversion for blinding and finalizing on every target.
crypto-bigint = { version = "=0.7.5", default-features = false, features = ["zeroize"] }
# Hostname-based auto-identity for generic Docker/container deployments.
hostname = "0.4"
libc = "0.2"
mio = { version = "1.1", features = ["net", "os-poll"] }

# Blind RSA signing, key generation and PKCS#8 import (profile BR1) run only
# on servers. Phones and Windows never compile AWS-LC; their server-only blind
# RSA functions return CryptoError.UnsupportedTarget.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
aws-lc-sys = { version = "=0.45.0", default-features = false }

[lints.rust]
# Set by scripts/compiler-coverage.py and the Docker proof's coverage build.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(mesh_coverage)"] }

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "json_collections"
harness = false
required-features = ["fuzzing"]

[[bench]]
name = "collection_format"
harness = false
required-features = ["fuzzing"]

[[bench]]
name = "routing"
harness = false

[[bench]]
name = "snapshot"
harness = false
