[package]
name = "mesh-pkg"
version = "0.1.9"
edition = "2021"
description = "Mesh language package manager (manifest parsing, dependency resolution, lockfile)"

[dependencies]
mesh-common = { path = "../mesh-common" }
mesh-diagnostics = { path = "../mesh-diagnostics" }
mesh-parser = { path = "../mesh-parser" }
mesh-typeck = { path = "../mesh-typeck" }
toml = { workspace = true }
toml_edit = { version = "0.22", default-features = false, features = ["parse"] }
git2 = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
mesh-lint = { path = "../mesh-lint" }
tempfile = "3"
