name: Hosted database benchmark calibration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BASELINE_SHA: e7abb534f38b97ba2cbfac097518c06b0ae619c2
      HARNESS_BASE_SHA: 737871878982656ff842b87c488aa601294fba30
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: ${{ github.workspace }}/scripts/ci-x86_64-linux-gnu-clang
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read toolchain versions
        id: versions
        run: cat tools/performance/versions.env >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: llvm
        with:
          path: ~/llvm
          key: llvm-${{ steps.versions.outputs.PERF_LLVM_VERSION }}-v4-x86_64-unknown-linux-gnu

      - name: Install LLVM
        if: steps.llvm.outputs.cache-hit != 'true'
        env:
          LLVM_VERSION: ${{ steps.versions.outputs.PERF_LLVM_VERSION }}
          LLVM_SHA256: ${{ steps.versions.outputs.PERF_LLVM_LINUX_AMD64_SHA256 }}
        run: |
          archive="LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/$archive" \
            --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$LLVM_SHA256" "$RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$HOME/llvm"
          tar -xJf "$RUNNER_TEMP/$archive" --strip-components=1 -C "$HOME/llvm"
          rm "$RUNNER_TEMP/$archive"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.versions.outputs.PERF_RUST_VERSION }}

      - name: Build the exact main baseline
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/mesh-db-build
        run: |
          evidence="$RUNNER_TEMP/db-calibration"
          mkdir -p "$evidence"
          git merge-base --is-ancestor "$HARNESS_BASE_SHA" "$GITHUB_SHA"
          git worktree add --detach "$RUNNER_TEMP/mesh-db-main" "$BASELINE_SHA"
          export LLVM_SYS_211_PREFIX="$HOME/llvm"
          (
            cd "$RUNNER_TEMP/mesh-db-main"
            test "$(git rev-parse HEAD)" = "$BASELINE_SHA"
            cargo build --locked --release -p meshc -p mesh-rt
          )
          MESH_RT_LIB_PATH="$CARGO_TARGET_DIR/release/libmesh_rt.a" \
            "$CARGO_TARGET_DIR/release/meshc" build tools/db-performance/mesh \
            --opt-level 2 --output "$RUNNER_TEMP/mesh-db-baseline"
          {
            printf 'main=%s\nharness_base=%s\nworkflow=%s\n' "$BASELINE_SHA" "$HARNESS_BASE_SHA" "$GITHUB_SHA"
            printf 'harness_tree=%s\n' "$(git rev-parse HEAD:tools/db-performance)"
            rustc --version
            "$HOME/llvm/bin/llvm-config" --version
            sha256sum "$RUNNER_TEMP/mesh-db-baseline"
          } | tee "$evidence/build.txt"
          git worktree remove "$RUNNER_TEMP/mesh-db-main"

      - name: Wait for the runner to become idle
        run: |
          for attempt in {1..60}; do
            uptime | tee -a "$RUNNER_TEMP/db-calibration/host-load.txt"
            if awk '{exit !($1 <= 0.5)}' /proc/loadavg; then
              exit 0
            fi
            sleep 10
          done
          echo "Runner load did not settle before calibration" >&2
          exit 1

      - name: Run same-binary calibration
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          export MESH_TEST_DATABASE_URL="postgresql://postgres@127.0.0.1:$POSTGRES_PORT/postgres"
          python3 tools/db-performance/bench.py --self-test
          set -o pipefail
          calibrate() {
            local output="$1"
            local mode="$2"
            local workers="$3"
            local seed="$4"
            shift 4
            printf 'Running %s\n' "$output"
            uptime
            timeout 35m python3 tools/db-performance/bench.py \
              --baseline "$RUNNER_TEMP/mesh-db-baseline" \
              --candidate "$RUNNER_TEMP/mesh-db-baseline" \
              --check-noise --workers "$workers" --blocks 10 --warmup 4 \
              --seed "$seed" --out "$RUNNER_TEMP/db-calibration/$output" \
              --mode "$mode" "$@" | tee "$RUNNER_TEMP/db-calibration/$output.log"
          }

          mkdir -p "$RUNNER_TEMP/db-calibration/pilot" "$RUNNER_TEMP/db-calibration/full"
          failed=0
          calibrate pilot/pg_write pg_write 1 89 --actors 1 --iterations 10000 || failed=1
          calibrate pilot/sqlite_write sqlite_write 1 89 --actors 1 --iterations 10000 || failed=1
          if (( failed != 0 )); then
            exit 1
          fi

          calibrate full/pg_point pg_point 1 97 --iterations 600 || failed=1
          calibrate full/pg_typed pg_typed 1 97 --iterations 600 || failed=1
          calibrate full/pg_write_single pg_write 1 97 --actors 1 --iterations 10000 || failed=1
          calibrate full/pg_write_multi pg_write 1 97 --actors 16 64 --iterations 160 || failed=1
          calibrate full/sqlite_point sqlite_point 1 97 --iterations 6000 || failed=1
          calibrate full/sqlite_write_single sqlite_write 1 97 --actors 1 --iterations 10000 || failed=1
          calibrate full/sqlite_write_multi sqlite_write 1 97 --actors 16 64 --iterations 128 || failed=1
          calibrate full/pg_rows pg_rows 4 97 || failed=1
          calibrate full/pg_sleep pg_sleep 4 97 || failed=1
          calibrate full/sqlite_rows sqlite_rows 4 97 || failed=1
          exit "$failed"

      - name: Save raw calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-driver-calibration
          path: ${{ runner.temp }}/db-calibration
          if-no-files-found: error
