name: Deploy Services to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  secrets-preflight:
    if: github.ref == 'refs/heads/main'
    name: Verify deploy secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=()
          [[ -z "$CLOUDFLARE_API_TOKEN" ]] && missing+=("CLOUDFLARE_API_TOKEN")
          [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]] && missing+=("CLOUDFLARE_ACCOUNT_ID")
          if (( ${#missing[@]} )); then
            echo "::error title=Missing Cloudflare credentials::deploy-services.yml runs on push to main but this repo is missing: ${missing[*]}. Create an API token with Workers Scripts:Edit, Workers R2 Storage:Edit and Cloudflare Containers:Edit, then add it and the account ID as repository secrets."
            exit 1
          fi

  deploy-registry:
    name: Deploy mesh-registry
    needs: secrets-preflight
    runs-on: ubuntu-latest
    # The container image is a Rust release build via cargo-chef, so this is
    # the slow job; the image layers cache between runs on Cloudflare's side.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        run: npm ci --no-audit --no-fund
        working-directory: registry

      # wrangler builds the Dockerfile and pushes it to Cloudflare's managed
      # registry as part of `deploy`; ubuntu-latest already provides Docker.
      - name: Deploy registry to Cloudflare
        run: npx wrangler deploy
        working-directory: registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-packages-website:
    name: Deploy mesh-packages website
    needs: secrets-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: packages-website

      - name: Build
        run: npm run build
        working-directory: packages-website

      - name: Deploy packages website to Cloudflare
        run: npx wrangler deploy
        working-directory: packages-website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  health-check:
    name: Post-deploy health checks
    needs: [deploy-registry, deploy-packages-website]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify public surface contract
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python3 scripts/lib/m034_public_surface_contract.py public-http --root "$GITHUB_WORKSPACE" --artifact-dir "$RUNNER_TEMP/m034-public-surface-contract"
