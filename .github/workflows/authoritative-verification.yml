name: Authoritative verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Changed areas
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      actions: read # find the last green run to compare with

  whitespace-guard:
    name: Whitespace guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify incoming diff is whitespace-clean
        shell: bash
        run: |
          set -euo pipefail

          case "${{ github.event_name }}" in
            pull_request)
              range="${{ github.event.pull_request.base.sha }}...HEAD"
              ;;
            push)
              if [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
                range="HEAD^..HEAD"
              else
                range="${{ github.event.before }}..HEAD"
              fi
              ;;
            *)
              range="HEAD^..HEAD"
              ;;
          esac

          bash scripts/verify-no-sidecar-files.sh --diff-range "$range"
          bash scripts/verify-whitespace.sh --diff-range "$range"

  formatting:
    name: Formatting
    needs: changes
    if: needs.changes.outputs.compiler == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  rust-core:
    name: Rust core build and smoke
    needs: changes
    if: needs.changes.outputs.compiler == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mesh_jobs_ci
          POSTGRES_DB: mesh_jobs_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U mesh_jobs_ci -d mesh_jobs_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - &cache-llvm
        name: Cache LLVM
        uses: actions/cache@v4
        id: cache-llvm
        with:
          path: ~/llvm
          key: llvm-21.1.8-v4-x86_64-unknown-linux-gnu

      - &install-llvm
        name: Install LLVM 21 (Linux x86_64)
        if: runner.os == 'Linux' && steps.cache-llvm.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          LLVM_VERSION="21.1.8"
          LLVM_ARCHIVE="LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          LLVM_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/${LLVM_ARCHIVE}"
          curl -sSfL "$LLVM_URL" -o llvm.tar.xz
          mkdir -p "$HOME/llvm"
          tar xf llvm.tar.xz --strip-components=1 -C "$HOME/llvm"
          rm llvm.tar.xz

      - &configure-llvm
        name: Configure LLVM toolchain (Linux x86_64)
        shell: bash
        run: |
          "$HOME/llvm/bin/llvm-config" --version
          "$HOME/llvm/bin/clang" --version
          "$HOME/llvm/bin/ld.lld" --version
          echo "LLVM_SYS_211_PREFIX=$HOME/llvm" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=$GITHUB_WORKSPACE/scripts/ci-x86_64-linux-gnu-clang" >> "$GITHUB_ENV"

      - &install-rust
        name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 10
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: authoritative-verification-rust-core-x86_64-unknown-linux-gnu

      - name: Run core workspace tests
        shell: bash
        timeout-minutes: 60
        run: |
          # Whole crates, not only --lib: the parser, type checker and formatter
          # keep their integration and snapshot tests beside the library, and
          # the runtime's own suite covers the distribution transport.
          cargo test --locked -p mesh-parser -p mesh-typeck -p mesh-codegen -p mesh-fmt -p mesh-lint
          cargo test --locked -p mesh-rt --lib --test library --test library_memory
          cargo build --workspace --locked
          # The fuzz crate is its own workspace and only runs at release:
          # compile its targets here, or a runtime rename breaks the release.
          cargo check --locked --manifest-path fuzz/Cargo.toml --bins
          # The examples and official packages are what users copy from: lint
          # them and keep them formatted.
          for path in examples packages mesh-slug; do
            ./target/debug/meshc lint "$path"
            ./target/debug/meshc fmt --check "$path"
          done
          # e2e_library builds static and dynamic libraries and runs a C host.
          # e2e_crypto_v2 and e2e_secret run the published crypto vectors
          # (ML-KEM, RFC 9578 blind RSA), the OpenSSL differential and the
          # secret-resource contract through compiled Mesh.
          cargo test --locked -p meshc --test e2e --test tooling_e2e --test e2e_language_fixes --test e2e_performance --test e2e_library --test e2e_crypto_v2 --test e2e_secret

      - name: Prove durable jobs on PostgreSQL
        timeout-minutes: 10
        env:
          MESH_TEST_DATABASE_URL: postgresql://mesh_jobs_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/mesh_jobs_ci?sslmode=disable
        run: bash scripts/verify-postgres-jobs.sh

  postgres-compatibility:
    name: PostgreSQL ${{ matrix.version }} compatibility (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.compiler == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        version: ['17.11', '18.7', '19.0']
        include:
          - version: '17.11'
            sha256: dd27f2b3c59e73ed14aa3324901242bf69a032a6347805f274e6260322d42979
          - version: '18.7'
            sha256: 441dfae4280cae3e0425e5f876f80559fb0731c140f1aae22b3e5a54d0411bfd
          - version: '19.0'
            sha256: a89fd70efbad6a08c7dbed8d4872e3af30170d9e5ca9dc7906523be95b4e692d
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        if: runner.os == 'Linux'
        id: cache-llvm
        with:
          path: ~/llvm
          key: llvm-21.1.8-v4-x86_64-unknown-linux-gnu

      - *install-llvm

      - name: Configure compiler and PostgreSQL dependencies
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y bison flex libssl-dev libzstd-dev libffi-dev libxml2-dev
            echo "LLVM_SYS_211_PREFIX=$HOME/llvm" >> "$GITHUB_ENV"
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=$GITHUB_WORKSPACE/scripts/ci-x86_64-linux-gnu-clang" >> "$GITHUB_ENV"
          else
            brew install llvm@21 bison flex openssl@3
            echo "LLVM_SYS_211_PREFIX=$(brew --prefix llvm@21)" >> "$GITHUB_ENV"
            for dependency in bison flex openssl@3; do
              echo "$(brew --prefix "$dependency")/bin" >> "$GITHUB_PATH"
            done
            echo "POSTGRES_OPENSSL_PREFIX=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: authoritative-verification-postgres-compatibility

      - name: Build the pinned PostgreSQL release with TLS
        timeout-minutes: 20
        shell: bash
        env:
          POSTGRES_VERSION: ${{ matrix.version }}
          POSTGRES_SHA256: ${{ matrix.sha256 }}
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            export CPPFLAGS="-I$POSTGRES_OPENSSL_PREFIX/include"
            export LDFLAGS="-L$POSTGRES_OPENSSL_PREFIX/lib"
            jobs=$(sysctl -n hw.logicalcpu)
          else
            jobs=$(nproc)
          fi
          cd "$RUNNER_TEMP"
          archive="postgresql-$POSTGRES_VERSION.tar.bz2"
          curl -fsSLO "https://ftp.postgresql.org/pub/source/v$POSTGRES_VERSION/$archive"
          printf '%s  %s\n' "$POSTGRES_SHA256" "$archive" | shasum -a 256 -c
          tar xjf "$archive"
          cd "postgresql-$POSTGRES_VERSION"
          ./configure --prefix="$RUNNER_TEMP/postgres" --with-ssl=openssl --without-icu --without-readline --without-zlib
          make -s -j "$jobs"
          make -s install
          for extension in pgcrypto pg_trgm; do
            make -s -C "contrib/$extension" -j "$jobs" install
          done
          echo "PG_BIN_DIR=$RUNNER_TEMP/postgres/bin" >> "$GITHUB_ENV"

      - name: Prove the driver, database APIs, and durable Jobs
        shell: bash
        env:
          POSTGRES_VERSION: ${{ matrix.version }}
        run: |
          mkdir -p target/jobs-postgres-proof
          bash scripts/verify-postgres-jobs.sh --compatibility "$POSTGRES_VERSION" --parity-driver-check --j6-roles \
            2>&1 | tee "target/jobs-postgres-proof/postgres-$POSTGRES_VERSION.log"

      - name: Save PostgreSQL proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-postgres-${{ matrix.version }}-${{ matrix.os }}
          path: target/jobs-postgres-proof/*.log

  # The ```mesh examples on the docs site must parse, lint and format cleanly.
  # rust-core runs these tests with the rest of the mesh-lint and mesh-fmt
  # suites; this covers a change to the docs alone, without LLVM.
  docs-examples:
    name: Docs examples
    needs: changes
    if: needs.changes.outputs.docs_site == 'true' && needs.changes.outputs.compiler != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: authoritative-verification-docs-examples

      - name: Lint and format the docs examples
        run: |
          cargo test --locked -p mesh-lint --test website_examples
          cargo test --locked -p mesh-fmt --test corpus

  docs-and-sites:
    name: Docs and sites build
    needs: changes
    # The docs build's prebuild tests check the VS Code grammar against
    # examples/ and the test fixtures, hence editors and compiler.
    if: >-
      needs.changes.outputs.docs_site == 'true' ||
      needs.changes.outputs.packages_site == 'true' ||
      needs.changes.outputs.editors == 'true' ||
      needs.changes.outputs.compiler == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            packages-website/package-lock.json

      - name: Build website docs
        if: needs.changes.outputs.docs_site == 'true' || needs.changes.outputs.editors == 'true' || needs.changes.outputs.compiler == 'true'
        run: |
          npm --prefix website ci
          npm --prefix website run build

      - name: Verify Neovim syntax parity
        if: needs.changes.outputs.editors == 'true' || needs.changes.outputs.compiler == 'true'
        shell: bash
        env:
          NVIM_SHA256: ab757a1fd9ad307d53d2df4045698906a7ca3993d92260dd8fe49108712d57d0
        run: |
          curl -sSfL https://github.com/neovim/neovim/releases/download/v0.12.1/nvim-linux-x86_64.tar.gz -o "$RUNNER_TEMP/nvim.tar.gz"
          echo "$NVIM_SHA256  $RUNNER_TEMP/nvim.tar.gz" | sha256sum --check
          tar xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          NEOVIM_BIN="$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" bash scripts/verify-m036-s02.sh syntax

      - name: Build packages website
        if: needs.changes.outputs.packages_site == 'true'
        run: |
          npm --prefix packages-website ci
          npm --prefix packages-website run build

  vscode-extension:
    name: VS Code extension package
    needs: changes
    if: needs.changes.outputs.editors == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/editors/vscode-mesh/package-lock.json

      - name: Verify and package extension
        shell: bash
        run: bash scripts/verify-m034-s04-extension.sh --package-only

# The autonomous cluster proof used to run here. It now runs on its own
# schedule (autonomous-cluster-proof.yml), because it needs more machine than
# a GitHub-hosted standard runner has and was failing every commit since
# 2026-09-18 -- including commits that touched nothing near it -- which made
# this workflow useless as a signal for the checks that do work. The reasoning
# and the evidence are recorded on the job in release.yml.
